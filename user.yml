- name : setup user server
  host : user
  become : yes
  tasks :
  - name : disable default  nodejs 
    ansible.builtin.command : dnf module disable nodejs -y  ## if no commands availble we can use builtin command 

  - name : enable nodejs 20
    ansible.builtin.command : dnf module enable nodejs:20 -y

  - name : install nodejs 
    ansible.builtin.package:
      name : nodejs
      state : present   

  - name : create roboshop system user
    ansible.builtin.user:
      name: roboshop
      comment: RoboShop System user
      system: true  
      shell : /sbin/nologin  
      home : /app 

  # Safe to remove directory, because 2nd time if we run it will download freshly. no error if does not exist
  - name: remove app directory
    ansible.builtin.file:
      path: /app
      state: absent 

  - name : create app directory
    ansible.builtin.file:
      state : directory
      path : /app 

  - name : Delete user file
    ansible.builtin.file:
      path : /tmp/user.zip
      state : absent

  - name: Download user application 
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/user-v3.zip
      dest: /tmp/user.zip

  - name: unzip user  #Unarchive a file that is already on the remote machine
    ansible.builtin.unarchive:
      src: /tmp/user.zip
      dest: /app 
      remote_src: yes 

  - name: install dependencies
    community.general.npm:
      path: /app  

  - name : copy user service  
    ansible.builtin.copy:
      src : user.service
      dest : /etc/systemd/system/user.service  


  - name: daemon reload enable and start
    ansible.builtin.systemd_service:
      name: user
      enabled: true
      state: started
      daemon_reload: true
           
