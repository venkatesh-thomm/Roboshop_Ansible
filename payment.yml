- name: setup payment server
  hosts: payment                            # This playbook runs on all hosts in the 'payment' inventory group.
  become: yes                               # Runs all tasks as root (using sudo), needed for package installation and service setup.

  tasks:
  - name: install python and build dependencies
    ansible.builtin.dnf:                    # Uses DNF (RHEL/CentOS 8+ package manager) to install required system packages.
      name: "{{ item }}"                    # Loops through the list of packages below.
      state: present                        # Ensures each package is installed; skips if already installed.
    loop:
    - python3                               # Installs Python 3 (required to run the Payment service).
    - gcc                                   # Installs GNU Compiler Collection — required for compiling Python packages.
    - python3-devel                         # Installs Python development headers — required by some Python dependencies during installation.

  - name: create roboshop system user
    ansible.builtin.user:                   # Creates a dedicated system user to run the application securely.
      name: roboshop                        # The username under which the app runs.
      comment: RoboShop System user         # Optional comment for clarity.
      system: true                          # Marks it as a system account (non-login, UID < 1000).
      shell: /sbin/nologin                  # Disables direct login for this user for security.
      home: /app                            # Sets the home directory for the application.

  - name: remove existing app directory
    ansible.builtin.file:                   # Manages file and directory states.
      path: /app                            # Target directory to remove.
      state: absent                         # Deletes the /app directory and its contents if it exists.
                                             # Safe cleanup step before redeployment.

  - name: create fresh app directory
    ansible.builtin.file:
      state: directory                      # Ensures /app directory exists.
      path: /app                            # Path where the payment application will be placed.

  - name: delete old payment zip file
    ansible.builtin.file:
      path: /tmp/payment.zip                # Old or leftover ZIP file location.
      state: absent                         # Deletes it if present to avoid conflicts.

  - name: download latest payment application
    ansible.builtin.get_url:                # Downloads files from a given URL to the target host.
      url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip
                                            # URL of the latest Payment service build (artifact stored in S3).
      dest: /tmp/payment.zip                # Download destination on the remote host.

  - name: extract payment application
    ansible.builtin.unarchive:              # Extracts compressed files like .zip or .tar.gz.
      src: /tmp/payment.zip                 # Path to the downloaded ZIP file.
      dest: /app                            # Destination directory to extract files into.
      remote_src: yes                       # Indicates that the ZIP file already exists on the target system (not fetched from control node).

  - name: install Python dependencies
    ansible.builtin.pip:                    # Installs Python packages from requirements.txt using pip.
      requirements: requirements.txt        # Specifies the dependency list file located inside /app.
      executable: pip3.9                    # Ensures the correct pip version (Python 3.9) is used.
    args:
      chdir: /app                           # Changes working directory to /app before running pip command.

  - name: copy payment systemd service file
    ansible.builtin.copy:                   # Copies a service definition file from control node to remote server.
      src: payment.service                  # Source service file (stored in your Ansible project).
      dest: /etc/systemd/system/payment.service
                                            # Destination on the remote system (systemd service directory).
                                            # This defines how the Payment service should run.

  - name: reload daemon, enable and start payment service
    ansible.builtin.systemd_service:        # Manages systemd services.
      name: payment                         # Service name (should match payment.service).
      enabled: true                         # Enables service to start automatically on boot.
      state: started                        # Starts the service immediately.
      daemon_reload: true                   # Reloads systemd to recognize the newly copied service file.