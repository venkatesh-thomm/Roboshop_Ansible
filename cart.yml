- name : setup cart server
  host : cart
  become : yes
  tasks :
  - name : disable default  nodejs 
    ansible.builtin.command : dnf module disable nodejs -y  ## if no commands availble we can use builtin command 

  - name : enable nodejs 20
    ansible.builtin.command : dnf module enable nodejs:20 -y

  - name : install nodejs 
    ansible.builtin.package:
      name : nodejs
      state : present   

  - name : create roboshop system cart
    ansible.builtin.user:
      name: roboshop
      comment: RoboShop System user
      system: true  
      shell : /sbin/nologin  
      home : /app 

  # Safe to remove directory, because 2nd time if we run it will download freshly. no error if does not exist
  - name: remove app directory
    ansible.builtin.file:
      path: /app
      state: absent 

  - name : create app directory
    ansible.builtin.file:
      state : directory
      path : /app 

  - name : Delete cart file
    ansible.builtin.file:
      path : /tmp/cart.zip
      state : absent

  - name: Download cart application 
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip
      dest: /tmp/cart.zip

  - name: unzip cart  #Unarchive a file that is already on the remote machine
    ansible.builtin.unarchive:
      src: /tmp/cart.zip
      dest: /app 
      remote_src: yes 

  - name: install dependencies
    community.general.npm:
      path: /app  

  - name : copy cart service  
    ansible.builtin.copy:
      src : cart.service
      dest : /etc/systemd/system/cart.service  


  - name: daemon reload enable and start
    ansible.builtin.systemd_service:
      name: cart
      enabled: true
      state: started
      daemon_reload: true
           
